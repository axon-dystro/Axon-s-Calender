<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Axon´s Calender</title>
  <desc id="desc">Ein violett-rosa Kristall mit einem A und zwei Umlaufringen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090510"/>
      <stop offset="1" stop-color="#1b0d2b"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9bdc" stop-opacity=".9"/>
      <stop offset=".48" stop-color="#bd63ec" stop-opacity=".72"/>
      <stop offset="1" stop-color="#7041b5" stop-opacity=".62"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#e978d8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a85cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="205" fill="url(#glow)" filter="url(#blur)"/>
  <g fill="none" stroke-linecap="round">
    <ellipse cx="256" cy="256" rx="203" ry="91" stroke="#e8b6ff" stroke-opacity=".34" stroke-width="5" transform="rotate(-12 256 256)"/>
    <ellipse cx="256" cy="256" rx="184" ry="68" stroke="#f076ca" stroke-opacity=".45" stroke-width="3" stroke-dasharray="11 18" transform="rotate(17 256 256)"/>
  </g>
  <rect x="145" y="116" width="222" height="280" rx="70" fill="url(#crystal)" stroke="#ffd2f1" stroke-opacity=".58" stroke-width="4" transform="rotate(-7 256 256)"/>
  <path d="M165 163 266 117l-38 134z" fill="#fff" fill-opacity=".18"/>
  <path d="m349 350-105 48 39-136z" fill="#4d267c" fill-opacity=".2"/>
  <text x="256" y="320" fill="#fff7ff" font-family="Arial,Helvetica,sans-serif" font-size="180" font-weight="700" text-anchor="middle">A</text>
  <circle cx="424" cy="187" r="9" fill="#fff"/>
  <circle cx="87" cy="310" r="7" fill="#f371ca"/>
</svg>
